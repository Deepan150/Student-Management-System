<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
     <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <h2>Student MS</h2>
            <nav>
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
                <a href="{{ url_for('students') }}">Students</a>
                <a href="{{ url_for('add_student') }}">Add Student</a>
                <a href="#" id="logoutBtn">
                    Logout
                </a>
            </nav>
        </aside>
        <main class="main-content">
            <div class="topbar">
                <div>
                    <h1>Add Student</h1>
                    <p>Create a new student record</p>
                </div>
            </div>
            <div class="form-card">
                <form  method="POST" action="{{ url_for('add_student') }}" id="studentForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="studentName">
                                Student Name
                            </label>
                            <input
                                type="text"
                                id="studentName"
                                name="name"
                                placeholder="Enter student name"
                                required
                            >
                        </div>
                        <div class="form-group">
                            <label for="studentAge">
                                Age
                            </label>
                            <input
                                type="number"
                                id="studentAge"
                                name="age"
                                placeholder="Enter age"
                                min="1"
                                max="100"
                                required
                            >
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="studentCourse">
                                Course
                            </label>
                            <select id="studentCourse" name="course" required>
                                <option value="">
                                    Select Course
                                </option>
                                <option value="B.E ECE">
                                    B.E ECE
                                </option>
                                <option value="B.E CSE">
                                    B.E CSE
                                </option>
                                <option value="B.Tech IT">
                                    B.Tech IT
                                </option>
                                <option value="BCA">
                                    BCA
                                </option>
                                <option value="MCA">
                                    MCA
                                </option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="studentPhone">
                                Phone
                            </label>
                            <input type="tel"
                                   id="studentPhone"
                                   name="phone"
                                   placeholder="Enter 10-digit phone number"
                                   maxlength="10"
                                   pattern="[0-9]{10}"
                                   required>

                            <small style="color: red;">
                                  Phone number must be exactly 10 digits.
                            </small>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="studentEmail">
                            Email
                        </label>
                        <input
                            type="email"
                            id="studentEmail"
                            name="email"
                            placeholder="Enter email"
                            required
                        >
                    </div>
                    <div id="formMessage"></div>
                    <div class="form-buttons">
                        <button
                            type="submit"
                            class="btn btn-primary">
                            Add Student
                        </button>
                        <a
                            href="students.html"
                            class="btn btn-secondary">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
