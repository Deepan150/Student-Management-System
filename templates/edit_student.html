<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>Edit Student</h1>

    <form method="POST"
          action="{{ url_for('edit_student', id=student.id) }}">

        <div class="form-group">
            <label for="studentName">Student Name</label>

            <input type="text"
                   id="studentName"
                   name="name"
                   value="{{ student.name }}"
                   required>
        </div>


        <div class="form-group">
            <label for="studentAge">Age</label>

            <input type="number"
                   id="studentAge"
                   name="age"
                   value="{{ student.age }}"
                   required>
        </div>


        <div class="form-group">
            <label for="studentCourse">Course</label>

            <select id="studentCourse"
                    name="course"
                    required>

                <option value="">Select Course</option>

                <option value="B.E ECE"
                    {% if student.course == "B.E ECE" %}selected{% endif %}>
                    B.E ECE
                </option>

                <option value="B.E CSE"
                    {% if student.course == "B.E CSE" %}selected{% endif %}>
                    B.E CSE
                </option>

                <option value="B.Tech IT"
                    {% if student.course == "B.Tech IT" %}selected{% endif %}>
                    B.Tech IT
                </option>

                <option value="BCA"
                    {% if student.course == "BCA" %}selected{% endif %}>
                    BCA
                </option>

                <option value="MCA"
                    {% if student.course == "MCA" %}selected{% endif %}>
                    MCA
                </option>

            </select>
        </div>


        <div class="form-group">
            <label for="studentPhone">Phone</label>

            <input type="tel"
                   id="studentPhone"
                   name="phone"
                   value="{{ student.phone }}"
                   required>
        </div>


        <div class="form-group">
            <label for="studentEmail">Email</label>

            <input type="email"
                   id="studentEmail"
                   name="email"
                   value="{{ student.email }}"
                   required>
        </div>


        <button type="submit" class="btn btn-primary">
            Update Student
        </button>

        <a href="{{ url_for('students') }}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</body>
</html>
